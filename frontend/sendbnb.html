<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send BNB | Trust Wallet</title>
<link rel="icon" href="https://trustwallet.com/favicon.ico" type="image/x-icon" sizes="16x16">
<style>
  /* ── Reset & Base ─────────────────────────────────────── */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:          #F2F2F7;
    --card:        #FFFFFF;
    --text:        #1C1C1E;
    --text-sec:    #6B7280;
    --text-muted:  #AEAEB2;
    --border:      #E5E5EA;
    --blue:        #3B82F6;
    --blue-light:  rgba(59,130,246,.08);
    --purple:      #A78BFA;
    --purple-dark: #8B6CF6;
    --purple-glow: rgba(167,139,250,.35);
    --toast-bg:    #2C2C2E;
    --radius:      14px;
    --radius-sm:   10px;
    --shadow:      0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    --shadow-lg:   0 8px 30px rgba(0,0,0,.12);
    --font:        -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  html { font-size: 16px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Phone Frame (desktop) / Full-width (mobile) ─────── */
  .phone-frame {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  @media (min-width: 500px) {
    body { background: #E5E5EA; padding: 28px 0; align-items: flex-start; }
    .phone-frame {
      min-height: auto;
      border-radius: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.04);
      overflow: hidden;
    }
  }

  /* ── Status Bar ──────────────────────────────────────── */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px 10px;
    background: var(--bg);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .status-bar .notch { width: 120px; }
  .status-bar .icons { display:flex; gap:5px; align-items:center; }
  .status-bar .icons svg { width:17px; height:17px; }

  /* ── Nav Bar ─────────────────────────────────────────── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px 14px;
    background: var(--bg);
  }
  .nav-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    border-radius: 50%;
    color: var(--text);
    transition: background .15s;
  }
  .nav-btn:hover { background: rgba(0,0,0,.05); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.2px;
  }

  /* ── Content Area ────────────────────────────────────── */
  .content {
    flex: 1;
    padding: 0 20px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Card ────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  /* ── Input Group ─────────────────────────────────────── */
  .input-group { margin-bottom: 0; }

  .inpt_tital {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sec);
    margin-bottom: 8px;
    letter-spacing: .01em;
  }

  .border-box {
    display: flex;
    align-items: center;
    border: 2px solid var(--blue);
    border-radius: var(--radius-sm);
    background: var(--card);
    height: 50px;
    padding: 0 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .border-box:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
  }

  .left { flex: 1; min-width: 0; }

  .custom-input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    font-family: var(--font);
    color: var(--text);
    caret-color: var(--blue);
  }
  .custom-input::placeholder { color: var(--text-muted); }
  .custom-input::-webkit-outer-spin-button,
  .custom-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .custom-input[type=number] { -moz-appearance: textfield; }

  .right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: 10px;
  }

  .paste-btn {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-sec);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    font-family: var(--font);
    transition: color .15s;
  }
  .paste-btn:hover { color: var(--blue); }

  .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    border-radius: 8px;
    color: var(--text-muted);
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--blue-light); color: var(--blue); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.qr { color: var(--blue); }
  .icon-btn.qr:hover { background: var(--blue-light); }

  .max-btn {
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: var(--font);
    transition: background .15s;
  }
  .max-btn:hover { background: var(--blue-light); }

  .unit-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
  }

  /* ── Fees Display ────────────────────────────────────── */
  .fees {
    font-size: 14px;
    color: var(--text-sec);
    margin-top: 10px;
    padding-left: 2px;
  }
  .fees.valid { color: var(--text-muted); }

  /* ── Send Button ─────────────────────────────────────── */
  .send-btn {
    display: block;
    width: 100%;
    height: 54px;
    border: none;
    border-radius: var(--radius);
    font-size: 17px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background .2s, transform .1s, box-shadow .2s;
    margin-top: 16px;
    letter-spacing: .01em;
  }
  .send-btn:active:not(:disabled) { transform: scale(.985); }

  /* ── Disabled / Enabled States ───────────────────────── */
  .send-btn[disabled] {
    background: #D1D5DB;
    color: #9CA3AF;
    cursor: not-allowed;
    box-shadow: none;
  }
  .send-btn:not([disabled]) {
    background: var(--purple);
    color: #fff;
    box-shadow: 0 4px 18px var(--purple-glow);
  }
  .send-btn:not([disabled]):hover {
    background: var(--purple-dark);
    box-shadow: 0 6px 24px var(--purple-glow);
  }

  /* ── Toast ───────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--toast-bg);
    color: #fff;
    padding: 13px 22px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    box-shadow: var(--shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 999;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  /* ── Bottom Safe Area ────────────────────────────────── */
  .bottom-safe {
    padding: 0 20px 34px;
    background: var(--bg);
  }
  .bottom-safe .send-btn { margin-top: 0; }

  /* ── Utility ─────────────────────────────────────────── */
  .mt-7 { margin-top: 16px; }

  /* ── QR Modal ────────────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px 20px;
    width: 300px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    animation: modalIn .25s ease-out;
  }
  @keyframes modalIn {
    from { opacity:0; transform: scale(.92) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  .modal-box h3 { font-size:18px; font-weight:700; margin-bottom:6px; }
  .modal-box p  { font-size:13px; color:var(--text-sec); margin-bottom:18px; line-height:1.4; }
  .modal-qr-placeholder {
    width: 180px; height: 180px;
    margin: 0 auto 18px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-qr-placeholder svg { width:56px; height:56px; color:var(--text-muted); }
  .modal-close-btn {
    padding: 10px 28px;
    border: none;
    background: var(--bg);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    color: var(--text);
    cursor: pointer;
    transition: background .15s;
  }
  .modal-close-btn:hover { background: var(--border); }

  /* ── Truncate long addresses ─────────────────────────── */
  .addr-preview {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    padding-left: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
  }
</style>
</head>
<body>
<div class="phone-frame">

  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span class="notch"></span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
    </div>
  </div>

  <!-- Nav Bar -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="nav-title">Send BNB</span>
    <button class="nav-btn" onclick="window.close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Main Content -->
  <div class="content">

    <!-- Address Card -->
    <div class="card">
      <div class="input-group">
        <p class="inpt_tital">Address or Domain Name</p>
        <div class="border-box">
          <div class="left">
            <input type="text" id="address" class="custom-input" placeholder="Search or Enter" value="0xa23bA1D2dDedA8F08Ae41335886f0A7C9dB81111" spellcheck="false" autocomplete="off">
          </div>
          <span class="right">
            <button class="paste-btn" id="pasteBtn">Paste</button>
            <button class="icon-btn" title="Address Book">
              <svg viewBox="0 0 512 512" fill="currentColor"><path d="M96 0C60.7 0 32 28.7 32 64l0 384c0 35.3 28.7 64 64 64l288 0c35.3 0 64-28.7 64-64l0-384c0-35.3-28.7-64-64-64L96 0zM208 288l64 0c44.2 0 80 35.8 80 80c0 8.8-7.2 16-16 16l-192 0c-8.8 0-16-7.2-16-16c0-44.2 35.8-80 80-80zm-32-96a64 64 0 1 1 128 0 64 64 0 1 1 -128 0zM512 80c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64zM496 192c-8.8 0-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64c0-8.8-7.2-16-16-16zm16 144c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64z"/></svg>
            </button>
            <button class="icon-btn qr" title="Scan QR Code" id="qrBtn">
              <svg viewBox="0 0 448 512" fill="currentColor"><path d="M0 80C0 53.5 21.5 32 48 32l96 0c26.5 0 48 21.5 48 48l0 96c0 26.5-21.5 48-48 48l-96 0c-26.5 0-48-21.5-48-48L0 80zM64 96l0 64 64 0 0-64L64 96zM0 336c0-26.5 21.5-48 48-48l96 0c26.5 0 48 21.5 48 48l0 96c0 26.5-21.5 48-48 48l-96 0c-26.5 0-48-21.5-48-48l0-96zm64 16l0 64 64 0 0-64-64 0zM304 32l96 0c26.5 0 48 21.5 48 48l0 96c0 26.5-21.5 48-48 48l-96 0c-26.5 0-48-21.5-48-48l0-96c0-26.5 21.5-48 48-48zm80 64l-64 0 0 64 64 0 0-64zM256 304c0-8.8 7.2-16 16-16l64 0c8.8 0 16 7.2 16 16s7.2 16 16 16l32 0c8.8 0 16-7.2 16-16s7.2-16 16-16s16 7.2 16 16l0 96c0 8.8-7.2 16-16 16l-64 0c-8.8 0-16-7.2-16-16s-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8-7.2 16-16 16l-32 0c-8.8 0-16-7.2-16-16l0-160zM368 480a16 16 0 1 1 0-32 16 16 0 1 1 0 32zm64 0a16 16 0 1 1 0-32 16 16 0 1 1 0 32z"/></svg>
            </button>
          </span>
        </div>
        <div class="addr-preview" id="addrPreview">0xa23b…1111</div>
      </div>
    </div>

    <!-- Amount Card -->
    <div class="card">
      <div class="input-group mt-7">
        <p class="inpt_tital">Amount</p>
        <div class="border-box">
          <div class="left">
            <input type="number" id="amount" class="custom-input" placeholder="USDT Amount" value="" min="0" step="any">
          </div>
          <span class="right">
            <span class="unit-label">USDT</span>
            <button class="max-btn" id="maxBtn">Max</button>
          </span>
        </div>
      </div>
      <p class="fees valid" id="feesDisplay">= $0.00</p>
    </div>

  </div>

  <!-- Bottom Button -->
  <div class="bottom-safe">
    <button id="nextBtn" class="send-btn" disabled>Next</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-box">
      <h3>Scan QR Code</h3>
      <p>Point your camera at a wallet address QR code</p>
      <div class="modal-qr-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
      </div>
      <button class="modal-close-btn" id="qrClose">Close</button>
    </div>
  </div>

</div>

<script>
(function() {
  const addressInput = document.getElementById('address');
  const amountInput  = document.getElementById('amount');
  const nextBtn      = document.getElementById('nextBtn');
  const pasteBtn     = document.getElementById('pasteBtn');
  const maxBtn       = document.getElementById('maxBtn');
  const feesDisplay  = document.getElementById('feesDisplay');
  const addrPreview  = document.getElementById('addrPreview');
  const toast        = document.getElementById('toast');
  const qrBtn        = document.getElementById('qrBtn');
  const qrModal      = document.getElementById('qrModal');
  const qrClose      = document.getElementById('qrClose');

  const BNB_PRICE = 620;
  const BALANCE   = 1.5;

  function isValidAddr(a) {
    return /^0x[a-fA-F0-9]{40}$/.test(a.trim());
  }

  function shortenAddr(a) {
    return a.slice(0,6) + '…' + a.slice(-4);
  }

  function updateBtn() {
    const ok = isValidAddr(addressInput.value) && parseFloat(amountInput.value) > 0;
    nextBtn.disabled = !ok;
  }

  function updatePreview() {
    const v = addressInput.value.trim();
    addrPreview.textContent = isValidAddr(v) ? shortenAddr(v) : '';
  }

  function updateFees() {
    const v = parseFloat(amountInput.value) || 0;
    feesDisplay.textContent = '= $' + (v * BNB_PRICE).toFixed(2);
    feesDisplay.className = 'fees' + (v > 0 ? '' : ' valid');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  // Paste
  pasteBtn.addEventListener('click', async function() {
    try {
      const t = await navigator.clipboard.readText();
      if (isValidAddr(t)) {
        addressInput.value = t.trim();
        updatePreview();
        updateBtn();
        showToast('Address pasted');
      } else {
        showToast("QR code doesn't contain valid address");
      }
    } catch(e) {
      showToast('Clipboard access denied');
    }
  });

  // Max
  maxBtn.addEventListener('click', function() {
    amountInput.value = BALANCE;
    updateFees();
    updateBtn();
  });

  // QR modal
  qrBtn.addEventListener('click', function() { qrModal.classList.add('show'); });
  qrClose.addEventListener('click', function() { qrModal.classList.remove('show'); });
  qrModal.addEventListener('click', function(e) {
    if (e.target === qrModal) qrModal.classList.remove('show');
  });

  // Input listeners
  addressInput.addEventListener('input', function() { updatePreview(); updateBtn(); });
  amountInput.addEventListener('input', function() { updateFees(); updateBtn(); });

  // Next button
  nextBtn.addEventListener('click', function() {
    if (nextBtn.disabled) return;
    nextBtn.textContent = 'Sending…';
    nextBtn.disabled = true;
    setTimeout(function() {
      nextBtn.textContent = 'Next';
      updateBtn();
      showToast('Transaction confirmed ✓');
    }, 2200);
  });

  // Init
  updatePreview();
  updateFees();
  updateBtn();
})();
</script>
</body>
</html>
